<!-- Snackbar container -->
<div
  *ngIf="open"
  [ngClass]="containerClass"
  role="alert"
  aria-live="assertive"
  class="min-w-[356px] max-w-md"
>
  <!-- Content area -->
  <app-snackbar-content
    class="m-auto flex w-full"
    [message]="message"
    [action]="action"
  >
    <ng-content></ng-content>
  </app-snackbar-content>
</div>
