<div
  *ngIf="isVisible"
  [ngClass]="containerClass"
  [@slideFromTopLeft]="animationTrigger === 'slideFromTopLeft' && (open ? 'in' : 'void')"
  [@slideFromTopCenter]="animationTrigger === 'slideFromTopCenter' && (open ? 'in' : 'void')"
  [@slideFromTopRight]="animationTrigger === 'slideFromTopRight' && (open ? 'in' : 'void')"
  [@slideFromBottomLeft]="animationTrigger === 'slideFromBottomLeft' && (open ? 'in' : 'void')"
  [@slideFromBottomCenter]="animationTrigger === 'slideFromBottomCenter' && (open ? 'in' : 'void')"
  [@slideFromBottomRight]="animationTrigger === 'slideFromBottomRight' && (open ? 'in' : 'void')"
  (@slideFromTopLeft.done)="onAnimationDone($event)"
  (@slideFromTopCenter.done)="onAnimationDone($event)"
  (@slideFromTopRight.done)="onAnimationDone($event)"
  (@slideFromBottomLeft.done)="onAnimationDone($event)"
  (@slideFromBottomCenter.done)="onAnimationDone($event)"
  (@slideFromBottomRight.done)="onAnimationDone($event)"
  role="alert"
  aria-live="assertive"
  class="min-w-[356px] max-w-md"
>
  <!-- Content area -->
  <app-snackbar-content
    class="m-auto flex w-full"
    [message]="message"
    [action]="action"
  >
    <ng-content></ng-content>
  </app-snackbar-content>
</div>
